camera:
  camera_id: 0
  width: 640
  height: 480
  fps: 30
  buffer_size: 10
  reconnect_interval: 2.0
  max_reconnect_attempts: 5

logging:
  log_dir: "logs"
  max_bytes: 10485760  # 10MB
  backup_count: 5
  level: "INFO"

event_bus:
  queue_size: 100
  async_dispatch: true

exam:
  active_profile: "normal"
